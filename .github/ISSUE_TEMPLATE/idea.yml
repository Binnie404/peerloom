name: Idea
description: Suggest a feature or a change to how Peerloom works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How it could work. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Anything else
      description: Workarounds you use now, or how other tools handle it.
